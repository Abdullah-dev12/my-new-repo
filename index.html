<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Social Media Logos</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>Social Media Logos</h1>
  <p id="subtitle">Click a card to highlight it. Use the search to filter.</p>

  <button id="theme-toggle">&#127769; Dark Mode</button>

  <input
    type="text"
    id="search-input"
    placeholder="Search logos..."
    style="margin-bottom:24px;padding:8px 16px;border-radius:20px;border:1px solid #ccc;font-size:14px;outline:none;"
  >

  <div class="cards">
    <!-- Facebook -->
    <div class="card facebook">
      <img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook Logo">
      <h2>Facebook</h2>
      <a class="download-btn" href="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" download="facebook-logo.svg">Download</a>
    </div>

    <!-- Twitter / X -->
    <div class="card twitter">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6f/Logo_of_Twitter.svg" alt="Twitter Logo">
      <h2>Twitter</h2>
      <a class="download-btn" href="https://upload.wikimedia.org/wikipedia/commons/6/6f/Logo_of_Twitter.svg" download="twitter-logo.svg">Download</a>
    </div>

    <!-- Instagram -->
    <div class="card instagram">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram Logo">
      <h2>Instagram</h2>
      <a class="download-btn" href="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" download="instagram-logo.png">Download</a>
    </div>
  </div>

  <p id="footer">Social Media Logos &mdash; hover, click, or search to explore.</p>

  <!-- Toast Notification -->
  <div id="toast"></div>

  <script src="script.js"></script>
</body>
</html>
